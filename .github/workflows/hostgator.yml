# Publica a mesma prévia na HostGator (brandaz.com.br/novo) por FTPS, a cada push na main.
# Segredos (Settings → Secrets and variables → Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# A conta FTP deve ser criada no cPanel apontando só para public_html/novo.
name: Publicar na HostGator
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hostgator
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica se o FTP foi configurado
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: echo "ok=$([ -n "$FTP_SERVER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: '3.12'
      - name: Gera o site
        if: steps.cfg.outputs.ok == 'true'
        run: |
          python tools/build.py --pages _site
          cp tools/hostgator.htaccess _site/.htaccess
      - name: Envia por FTPS (só os arquivos que mudaram)
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./
          timeout: 600000
